# EUR-Lex Scraper System Documentation

## System Overview

The EUR-Lex Scraper System is a comprehensive Node.js-based solution for extracting, processing, and organizing legal documents from the EUR-Lex database. It consists of three main scripts that work together:

1. **combined-scraper.js**: The main orchestration script that coordinates the entire scraping process
2. **split-articles.js**: Extracts individual articles from legal documents
3. **html-to-md.js**: Converts HTML content to Markdown format

## Data Flow

```
[combined-scraper.js] ────┐
       │                  │
       ▼                  ▼
[split-articles.js]    [EUR-Lex API/Website]
       │                  │
       ▼                  ▼
   [HTML files]      [Case references]
       │                  │
       ▼                  ▼
[html-to-md.js]    [Case metadata/categorization]
       │                  │
       ▼                  ▼
 [Markdown files] [Summary markdown files]
       │                  │
       └──────────┬───────┘
                 ▼
        [Organized directory structure]
```

## 1. combined-scraper.js

### Purpose

The main entry point script that:
- Takes a CELEX number as input
- Orchestrates the extraction of articles and case law references
- Organizes content into a structured directory system
- Creates summary files and metadata reports

### Command Line Usage

```
node combined-scraper.js <CELEX_NUMBER> [options]

Options:
  --skip-download, -s  Skip downloading HTML files and only extract metadata
```

### Input Parameters

| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| celexNumber | String | Yes | The CELEX number of the legal document (e.g., 32016R0679) |
| skipDownload | Boolean | No | Flag to skip downloading HTML files (default: false) |

### Output

Creates a directory structure:
```
/<CELEX_NUMBER>/
  ├── articles/
  │   ├── html/          # HTML files for each article
  │   └── md/            # Markdown files for each article
  ├── case-law/
  │   ├── interpreted/
  │   │   ├── html/      # HTML files for case interpretations
  │   │   └── md/        # Markdown files for case interpretations
  │   ├── preliminary/
  │   │   ├── html/      # HTML files for preliminary references
  │   │   └── md/        # Markdown files for preliminary references
  │   └── other/
  │       ├── html/      # HTML files for other case references
  │       └── md/        # Markdown files for other case references
  ├── <CELEX_NUMBER>_full_html.html  # Full HTML of the document
  ├── articles-interpreted.md        # Article-specific interpretations
  ├── articles-preliminary.md        # Article-specific preliminary references
  ├── case-metadata.md               # Metadata for all case references
  ├── download-summary.md            # Summary of download results
  └── initial-references.md          # Raw initial references from main page
```

### Key Functions

#### `scrapeEurLex()`
- **Description**: Main function that orchestrates the entire scraping process
- **Returns**: Promise\<void\>
- **Process**:
  1. Downloads and splits articles using `split-articles.js`
  2. Converts article HTML to Markdown using `html-to-md.js`
  3. Fetches case references from the "Affected by case" section
  4. Categorizes references and extracts article references
  5. Creates markdown summary files
  6. Downloads case HTML files (unless `--skip-download` is specified)
  7. Creates article-specific reference summaries

#### `tryGetCaseMetadataFromXml(celexRef)`
- **Description**: Attempts to retrieve case metadata from Publications Office API XML
- **Parameters**:
  - `celexRef` (String): CELEX reference number
- **Returns**: Promise<Object|null> - Case metadata or null if not found
- **Process**:
  1. Makes an API request to Publications Office
  2. Parses XML response to extract case number, parties, and other metadata
  3. Returns structured metadata object or null if unsuccessful

#### `extractCaseMetadata(celexRef, linkUrl)`
- **Description**: Extracts case metadata using both XML and HTML methods
- **Parameters**:
  - `celexRef` (String): CELEX reference number
  - `linkUrl` (String): URL to access case content
- **Returns**: Promise\<Object\> - Case metadata
- **Process**:
  1. First tries XML metadata extraction using `tryGetCaseMetadataFromXml()`
  2. If unsuccessful, falls back to HTML parsing using cheerio
  3. Returns a structured metadata object

#### `determineCategory(celexRef, text)`
- **Description**: Categorizes a case reference based on text patterns and CELEX structure
- **Parameters**:
  - `celexRef` (String): CELEX reference number
  - `text` (String): Descriptive text about the case
- **Returns**: String - Category ("Preliminary question", "Interpreted", or "Other")
- **Process**:
  1. Checks for preliminary reference keywords in text
  2. Checks for interpretation keywords in text
  3. Analyzes CELEX number structure (6YYYYT[J|N]XXXX)
  4. Returns the appropriate category

#### `extractAllArticleReferences(text)`
- **Description**: Extracts all article, chapter, and recital references from text
- **Parameters**:
  - `text` (String): The input text to search for references
- **Returns**: String[] - Array of normalized references sorted by type and number
- **Process**:
  1. Uses multiple regex patterns to identify different reference formats
  2. Normalizes references to a consistent format
  3. Sorts by reference type and number
  4. Returns unique deduplicated references

#### `downloadAndSplitArticles(celexNumber)`
- **Description**: Downloads and splits articles using `split-articles.js`
- **Parameters**:
  - `celexNumber` (String): CELEX number
- **Returns**: Promise<String[]> - Array of saved file paths
- **Process**:
  1. Calls `split-articles.js` as a child process
  2. Passes the CELEX number and output directory
  3. Returns an array of article HTML file paths

#### `convertHtmlToMarkdown(htmlFiles, outputDir)`
- **Description**: Converts HTML files to Markdown using `html-to-md.js`
- **Parameters**:
  - `htmlFiles` (String[]): Array of HTML file paths
  - `outputDir` (String): Directory to save markdown files
- **Returns**: Promise<String[]> - Array of saved markdown file paths
- **Process**:
  1. Groups files by directory to minimize script calls
  2. Calls `html-to-md.js` for each directory
  3. Returns an array of markdown file paths

#### `createCategoryMarkdown(categories, outputDir)`
- **Description**: Creates markdown files for each case category
- **Parameters**:
  - `categories` (Object): Categorized case references
  - `outputDir` (String): Directory to save files
- **Returns**: Promise\<void\>
- **Process**:
  1. Creates a markdown file for each category
  2. Formats information in a table
  3. Writes files to the specified directory

#### `createArticleMarkdown(articleReferences, categories, outputDir)`
- **Description**: Creates markdown files for article-specific references
- **Parameters**:
  - `articleReferences` (Object): Article-referenced cases
  - `categories` (Object): Categorized case references
  - `outputDir` (String): Directory to save files
- **Returns**: Promise\<void\>
- **Process**:
  1. Separates references into interpreted and preliminary categories
  2. Creates markdown files with article-specific tables
  3. Adds a section for general interpretations

### Error Handling

- HTTP requests use timeout settings and retries
- Network errors, parsing errors, and API failures are logged
- Processing continues even if individual items fail
- Summary files include error information

### Dependencies

- **External Node.js packages**:
  - `axios`: HTTP requests
  - `cheerio`: HTML parsing
  - `fs`, `path`: File system operations
  - `xml2js`: XML parsing
  - `{ promisify }`: Promise-based API
  - `{ spawn }`: Child process execution
  - `TurndownService`: HTML to Markdown conversion

- **Internal scripts**:
  - `split-articles.js`: Article extraction
  - `html-to-md.js`: HTML to Markdown conversion

## 2. split-articles.js

### Purpose

A standalone script that:
- Downloads a legal document from EUR-Lex by CELEX number
- Extracts individual articles from the HTML content
- Saves the full HTML and individual article HTML files

### Command Line Usage

```
node split-articles.js <CELEX_NUMBER> [OUTPUT_DIRECTORY]
```

### Input Parameters

| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| celexNumber | String | Yes | The CELEX number of the legal document |
| outputDir | String | No | Directory to save article files (default: `<CELEX_NUMBER>_articles`) |

### Output

- Creates output directory if it doesn't exist
- Saves full HTML as `<CELEX_NUMBER>_full_html.html`
- Saves each article as `Article <NUMBER>.html`

### Key Functions

#### `extractArticlesFromCelex(celexNumber, outputDir)`
- **Description**: Main function to extract articles from a CELEX document
- **Parameters**:
  - `celexNumber` (String): CELEX number
  - `outputDir` (String): Output directory
- **Returns**: Promise<String[]> - Array of saved file paths
- **Process**:
  1. Downloads HTML content from EUR-Lex
  2. Saves the full HTML content
  3. Extracts articles using `extractArticles()`
  4. Saves articles using `saveArticles()`
  5. Returns an array of saved file paths

#### `extractArticles(htmlContent)`
- **Description**: Extracts articles from HTML content
- **Parameters**:
  - `htmlContent` (String): HTML content
- **Returns**: Object[] - Array of article objects with number, title, and html_content
- **Process**:
  1. Parses HTML using cheerio
  2. Finds elements with IDs starting with 'art_'
  3. Extracts article number, title, and HTML content
  4. Returns array of article objects sorted by number

#### `saveArticles(articles, outputDir)`
- **Description**: Saves articles as HTML files
- **Parameters**:
  - `articles` (Object[]): Array of article objects
  - `outputDir` (String): Directory to save articles
- **Returns**: String[] - Array of saved file paths
- **Process**:
  1. Creates output directory if it doesn't exist
  2. For each article, cleans the HTML (removes unnecessary elements)
  3. Saves each article as `Article <NUMBER>.html`
  4. Returns an array of saved file paths

#### `parseStrictInteger(str)`
- **Description**: Parses a string to an integer strictly, mimicking Python's int() behavior
- **Parameters**:
  - `str` (String): The string to parse
- **Returns**: Number - The parsed integer
- **Throws**: Error if the string is not a valid integer
- **Process**:
  1. Validates string format with regex
  2. Parses integer using parseInt()

### Error Handling

- Input validation for CELEX number
- Logging detailed debug information
- Checking HTML content before processing
- Output directory is created if it doesn't exist

### Dependencies

- **Node.js packages**:
  - `axios`: HTTP requests
  - `cheerio`: HTML parsing
  - `fs`, `path`: File system operations

## 3. html-to-md.js

### Purpose

A utility script that:
- Converts HTML files to Markdown format
- Applies special post-processing for legal document formatting
- Handles both individual files and directories

### Command Line Usage

```
node html-to-md.js <FILE_OR_DIRECTORY> [OUTPUT_FILE_OR_DIRECTORY]
```

### Input Parameters

| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| inputPath | String | Yes | HTML file or directory containing HTML files |
| outputPath | String | No | Output file or directory (default: replaces .html with .md or adds -md suffix to directory) |

### Output

- For files: Converts `file.html` to `file.md`
- For directories: Converts all HTML files to Markdown in the output directory

### Key Functions

#### `convertHTMLToMarkdown(htmlContent)`
- **Description**: Converts HTML content to Markdown
- **Parameters**:
  - `htmlContent` (String): HTML content
- **Returns**: String - Markdown content
- **Process**:
  1. Uses TurndownService to convert HTML to Markdown
  2. Returns the converted Markdown

#### `postProcessMarkdown(markdownContent)`
- **Description**: Post-processes markdown content for legal documents
- **Parameters**:
  - `markdownContent` (String): Markdown content
- **Returns**: String - Processed Markdown content
- **Process**:
  1. Identifies lines that match specific patterns (numbered lists, bullet points, etc.)
  2. Merges these lines with the next non-empty line
  3. Standardizes newlines between paragraphs
  4. Returns the processed content

#### `convertFile(inputPath, outputPath)`
- **Description**: Converts a single HTML file to Markdown
- **Parameters**:
  - `inputPath` (String): Path to HTML file
  - `outputPath` (String): Path to output Markdown file (optional)
- **Returns**: void
- **Process**:
  1. Reads HTML content from the input file
  2. Converts to Markdown using `convertHTMLToMarkdown()`
  3. Post-processes using `postProcessMarkdown()`
  4. Writes to the output file

#### `convertDirectory(inputDir, outputDir)`
- **Description**: Converts all HTML files in a directory to Markdown
- **Parameters**:
  - `inputDir` (String): Input directory
  - `outputDir` (String): Output directory (optional)
- **Returns**: void
- **Process**:
  1. Creates output directory if it doesn't exist
  2. Finds all HTML files in the input directory
  3. Converts each file using `convertFile()`
  4. Reports number of files converted

### Error Handling

- Input path validation
- Error logging for each file conversion
- Directory creation for output path

### Dependencies

- **Node.js packages**:
  - `TurndownService`: HTML to Markdown conversion
  - `fs`, `path`: File system operations

## Integration and Data Flow

### Input/Output Relationships

```
[Input]
CELEX Number (e.g., 32016R0679)
  │
  ▼
[combined-scraper.js]
  │
  ├─────────────────────┐
  │                     │
  ▼                     ▼
[split-articles.js]     [Publications Office API]
Downloads articles      Fetches case metadata
  │                     │
  ▼                     ▼
[HTML Article Files]    [Case Reference Data]
  │                     │
  ▼                     ▼
[html-to-md.js]        [Categorization Process]
  │                     │
  ▼                     ▼
[Markdown Files]        [Summary Markdown Files]
  │                     │
  └─────────────┬───────┘
                ▼
[Output] Organized directory with articles, case references, and summary files
```

### Process Steps and Control Flow

1. **Initialization (combined-scraper.js)**:
   - Validates CELEX number
   - Creates directory structure
   - Initiates scraping process

2. **Article Extraction (split-articles.js)**:
   - Downloads full document HTML
   - Extracts individual articles
   - Saves article HTML files

3. **Case Reference Collection (combined-scraper.js)**:
   - Fetches "Affected by case" section
   - Extracts case references
   - Categorizes references

4. **Metadata Enrichment (combined-scraper.js)**:
   - Attempts to get metadata from Publications Office API
   - Falls back to HTML parsing if needed
   - Associates metadata with references

5. **Content Download (combined-scraper.js)**:
   - Downloads case HTML files (unless skip-download)
   - Organizes files by category

6. **HTML to Markdown Conversion (html-to-md.js)**:
   - Converts all HTML files to Markdown
   - Applies special formatting for legal documents

7. **Summary Generation (combined-scraper.js)**:
   - Creates category-specific summaries
   - Creates article-specific reference summaries
   - Generates metadata reports

### Error Handling and Recovery

- Each script includes error handling to continue processing despite failures
- Rate limiting and delays are implemented to avoid overwhelming the EUR-Lex servers
- Detailed logging helps diagnose issues
- Summary files include error information for troubleshooting

## Usage Examples

### Basic Usage

```bash
# Extract articles and case law from GDPR regulation
node combined-scraper.js 32016R0679
```

### Skip HTML Download

```bash
# Extract only metadata without downloading case HTML
node combined-scraper.js 32016R0679 --skip-download
```

### Extract Articles Only

```bash
# Use split-articles.js directly to extract articles
node split-articles.js 32016R0679 ./output-dir
```

### Convert HTML to Markdown

```bash
# Convert a single HTML file
node html-to-md.js Article_1.html

# Convert all HTML files in a directory
node html-to-md.js ./html-dir ./md-dir
```

## Troubleshooting

### Common Issues and Solutions

1. **No articles found**:
   - Check if the CELEX number is correct
   - Verify EUR-Lex website structure hasn't changed
   - Examine the full HTML file for article patterns

2. **Metadata extraction fails**:
   - Publications Office API might be rate-limited
   - Try with `--skip-download` flag to focus on metadata
   - Check if CELEX format is valid

3. **Missing case references**:
   - The document may not have any case references
   - Check if "Affected by case" section exists in the HTML

4. **Slow performance**:
   - Large documents with many articles may take time
   - Use `--skip-download` flag to reduce processing time
   - Rate limiting delays between requests are intentional

## Technical Requirements

- Node.js v12.0.0 or higher
- NPM packages: axios, cheerio, fs, path, xml2js, turndown
- Internet connection to access EUR-Lex and Publications Office API